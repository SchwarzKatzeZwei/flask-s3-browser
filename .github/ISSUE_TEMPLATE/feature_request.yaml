name: Feature request
description: 機能リクエスト
title: "[Feat]: "
labels: ["Type: Enhancement"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: このissueの目的を記入する。
      placeholder: このissueの目的を記入する。
    validations:
      required: true

  - type: textarea
    id: task_list
    attributes:
      label: タスクリスト
      description: このタスクの達成に必要な作業を具体的に列挙する。
      value: |
        + [ ] 
    validations:
      required: false

  - type: textarea
    id: definition_of_done
    attributes:
      label: 完了の定義
      description: このタスクが「完了した」と言える状態を記載する。
      placeholder: このタスクが「完了した」と言える状態を記載する。
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 参考
      description: 関連する資料やissueがあれば記載する。
      placeholder: "- https://example.com"
    validations:
      required: false

  - type: textarea
    id: notice
    attributes:
      label: 留意事項
      value: |
        * 
    validations:
      required: false

  - type: textarea
    id: consideration
    attributes:
      label: 検討事項
      value: |
        * 
    validations:
      required: false
